name: Feature request
description: Propose a focused local-first Datary improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What experiment workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducibility and safety considerations
      description: Mention formats, assumptions, compatibility, privacy, and failure behaviour.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This can remain local-first and does not require telemetry or a hosted service.
          required: true
