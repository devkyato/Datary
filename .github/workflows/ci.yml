name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: mypy
      - run: python scripts/verify_reproducible.py
      - run: datary generate noisy-sensor --seed 1 > sample.jsonl
      - run: datary record demo --format jsonl --time-field timestamp < sample.jsonl
      - run: datary inspect demo
      - run: datary report demo
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: {name: "dist-${{ matrix.python }}", path: dist/*}
  wheel-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/datary-smoke
      - run: /tmp/datary-smoke/bin/pip install dist/*.whl
      - run: /tmp/datary-smoke/bin/datary --version

